name: AskYourDoubt Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app.py db.py auth.py utils.py routes
      - name: Import Flask routes
        run: python -c "import app; rules=list(app.app.url_map.iter_rules()); print('Registered routes:', len(rules)); assert len(rules) >= 57"
      - name: Run integration and UI contract tests
        run: |
          mkdir -p test_results/pytest_core
          python -m pytest -q tests --basetemp test_results/pytest_core -p no:cacheprovider --junitxml=core-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-junit-python-${{ matrix.python-version }}
          path: core-junit.xml
