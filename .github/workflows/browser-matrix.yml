name: AskYourDoubt Full CI-CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile and import routes
        run: |
          python -m compileall -q app.py db.py auth.py utils.py routes
          python -c "import app; rules=list(app.app.url_map.iter_rules()); print('Registered routes:', len(rules)); assert len(rules) >= 57"
      - name: Run functional and requirement contract tests
        run: |
          mkdir -p test_results/core
          python -m pytest -q tests --basetemp test_results/core -p no:cacheprovider --junitxml=core-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-junit
          path: core-junit.xml

  browser-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run live responsive and interaction tests
        run: |
          mkdir -p test_results/browser-${{ matrix.browser }}
          python -m pytest -q browser_tests --browser ${{ matrix.browser }} --basetemp test_results/browser-${{ matrix.browser }} -p no:cacheprovider --junitxml=browser-${{ matrix.browser }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-junit-${{ matrix.browser }}
          path: browser-${{ matrix.browser }}.xml

  docker-smoke:
    needs: browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t askyourdoubt:ci .
      - name: Run health smoke test
        run: |
          docker run -d --name askyourdoubt-ci -p 9090:9000 \
            -e AYD_SECRET_KEY=ci-only-secret \
            -e AYD_DATABASE=/app/data/database.db \
            askyourdoubt:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9090/healthz; then exit 0; fi
            sleep 2
          done
          docker logs askyourdoubt-ci
          exit 1
      - name: Container logs
        if: always()
        run: docker logs askyourdoubt-ci || true
      - name: Remove smoke container
        if: always()
        run: docker rm -f askyourdoubt-ci || true

  publish-ghcr:
    needs: docker-smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/askyourdoubt
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
