name: AskYourDoubt CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py db.py auth.py utils.py routes
      - run: python -c "import app; rules=list(app.app.url_map.iter_rules()); print(len(rules)); assert len(rules)>=45"
      - run: mkdir -p test_results/pytest
      - run: python -m pytest -q tests --basetemp test_results/pytest -p no:cacheprovider --junitxml test_results/core-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-python-${{ matrix.python-version }}
          path: test_results/

  browser-tests:
    needs: core-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: mkdir -p test_results/${{ matrix.browser }}
      - run: python -m pytest -q browser_tests --browser ${{ matrix.browser }} --basetemp test_results/${{ matrix.browser }}/tmp -p no:cacheprovider --junitxml test_results/${{ matrix.browser }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: test_results/

  docker-smoke:
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t askyourdoubt:ci .
      - run: docker run -d --name askyourdoubt-ci -p 9000:9000 -e AYD_SECRET_KEY=ci-only-secret askyourdoubt:ci
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs askyourdoubt-ci
          exit 1
      - if: always()
        run: docker logs askyourdoubt-ci > docker-smoke.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke
          path: docker-smoke.log
      - if: always()
        run: docker rm -f askyourdoubt-ci || true

  publish-image:
    needs: [core-tests, browser-tests, docker-smoke]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/askyourdoubt" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
