name: AskYourDoubt Production CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app.py db.py auth.py utils.py routes
      - name: Run tests
        run: python -m pytest -q tests -p no:cacheprovider

  docker-smoke:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t askyourdoubt:production .
      - name: Run smoke container
        run: |
          docker run -d --name askyourdoubt -p 9000:9000 \
            -e AYD_SECRET_KEY=ci-secret \
            -e AYD_BASE_URL=http://127.0.0.1:9000 \
            askyourdoubt:production
          sleep 10
          curl -f http://127.0.0.1:9000/healthz
          docker logs askyourdoubt
