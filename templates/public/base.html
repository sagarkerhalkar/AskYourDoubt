<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9ff">
  <meta name="description" content="Ask Your Doubt — live classroom questions, resources, analytics, and realtime engagement.">
  <title>{% block title %}Ask Your Doubt{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}">
  <script defer src="{{ url_for('static',filename='js/app.js') }}"></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="grid-noise"></div>
  {% block body %}{% endblock %}
</body>
</html>
