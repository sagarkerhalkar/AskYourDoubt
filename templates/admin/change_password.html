{% extends 'admin/base.html' %}{% block title %}Change Admin Password{% endblock %}{% block content %}<section class="page-head"><div><span class="eyebrow">Admin Security</span><h1>Change Your Password</h1><p>Use at least 8 characters.</p></div></section><section class="panel" style="max-width:620px">{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><div class="form-group"><label>Current password</label><input class="input" type="password" name="current_password" required></div><div class="form-group"><label>New password</label><input class="input" type="password" name="new_password" minlength="8" required></div><div class="form-group"><label>Confirm password</label><input class="input" type="password" name="confirm_password" minlength="8" required></div><button class="btn orange">Update Admin Password</button></form></section>{% endblock %}
