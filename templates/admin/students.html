<!DOCTYPE html>
<html>

<head>
    <title>Students</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="header">
    <h1>Students</h1>
</div>

<div class="container">

    <div class="section links">
        <a href="/admin-dashboard">Dashboard</a>
        <a href="/admin-export-students">Download Students</a>
    </div>

    <div class="section">

        <div class="page-title-row">
            <h2>Student Records</h2>
            <span class="badge">Total: {{ students|length }}</span>
        </div>

        {% if students|length == 0 %}

        <div class="student-empty">
            No students found.
        </div>

        {% else %}

        <table class="table">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Mobile</th>
            </tr>

            {% for student in students %}

            <tr>
                <td>{{ student[0] }}</td>
                <td><b>{{ student[1] }}</b></td>
                <td>{{ student[2] }}</td>
            </tr>

            {% endfor %}

        </table>

        {% endif %}

    </div>

</div>

</body>
</html>
