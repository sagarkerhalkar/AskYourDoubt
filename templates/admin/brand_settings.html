{% extends 'admin/base.html' %}{% block title %}Logo & Brand{% endblock %}{% block content %}<section class="page-head"><div><span class="eyebrow">Brand Control</span><h1>High-Resolution Logo</h1><p>Upload PNG, JPG, WEBP, or SVG. Recommended width: 1024 pixels or more.</p></div></section><section class="dashboard-grid"><div class="panel span-6"><h2>Current Logo</h2><div style="padding:24px;background:#07130f;border-radius:18px;margin:16px 0"><img src="{{ brand_logo }}" alt="Current logo" style="max-height:120px"></div></div><div class="panel span-6"><h2>Upload New Logo</h2>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data"><div class="form-group"><label>Logo file</label><input type="file" name="logo" accept=".png,.jpg,.jpeg,.webp,.svg" required></div><button class="btn orange">Update Logo Everywhere</button></form></div></section>{% endblock %}
