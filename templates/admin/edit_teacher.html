{% extends 'admin/base.html' %}{% block title %}Edit Teacher{% endblock %}{% block content %}<section class="page-head"><div><span class="eyebrow">Teacher Profile</span><h1>Edit {{ teacher.name }}</h1><p>Update teacher details without changing session history.</p></div></section><section class="panel" style="max-width:700px">{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><div class="form-group"><label>Name</label><input class="input" name="name" value="{{ teacher.name }}" required></div><div class="form-group"><label>Mobile</label><input class="input" name="mobile" value="{{ teacher.mobile }}" pattern="[0-9]{10}" maxlength="10" required></div><div class="form-group"><label>Email</label><input class="input" type="email" name="email" value="{{ teacher.email or '' }}"></div><div class="form-group"><label>Date of birth</label><input class="input" type="date" name="dob" value="{{ teacher.dob or '' }}"></div><div class="form-group"><label>Username</label><input class="input" name="username" value="{{ teacher.username }}" required></div><button class="btn">Save Changes</button></form></section>{% endblock %}
