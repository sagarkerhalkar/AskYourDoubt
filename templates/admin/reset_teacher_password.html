{% extends 'admin/base.html' %}{% block title %}Reset Teacher Password{% endblock %}{% block content %}<section class="page-head"><div><span class="eyebrow">Teacher Security</span><h1>Reset {{ teacher.name }}’s Password</h1><p>Username: {{ teacher.username }}</p></div></section><section class="panel" style="max-width:620px">{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><div class="form-group"><label>New password</label><input class="input" type="password" name="new_password" minlength="8" required></div><div class="form-group"><label>Confirm password</label><input class="input" type="password" name="confirm_password" minlength="8" required></div><button class="btn">Reset Password</button></form></section>{% endblock %}
