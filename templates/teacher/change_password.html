<!DOCTYPE html>
<html>

<head>
    <title>Change Teacher Password</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="join-wrapper">

    <div class="join-left">

        <h1>Teacher Security</h1>

        <p>
            Change your password to protect your classroom sessions and student data.
        </p>

    </div>

    <div class="join-right">

        <div class="join-card">

            <h2>Change Teacher Password</h2>

            <form method="POST">

                <label>Current Password</label>
                <br>

                <input
                    type="password"
                    name="current_password"
                    placeholder="Enter current password"
                    required>

                <br><br>

                <label>New Password</label>
                <br>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    required>

                <br><br>

                <label>Confirm New Password</label>
                <br>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required>

                <br><br>

                <button class="primary-btn">
                    Change Password
                </button>

            </form>

            <br>

            <a class="btn btn-gray" href="/teacher-dashboard">
                Back to Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>
