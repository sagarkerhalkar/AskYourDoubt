{% extends 'teacher/base.html' %}{% block title %}Create Session{% endblock %}{% block content %}<section class="page-head"><div><span class="eyebrow">New live classroom</span><h1>Create a doubt session</h1><p>Set the session name, duration, and the maximum questions allowed per student.</p></div></section><section class="panel" style="max-width:760px"><form method="post"><div class="form-group"><label>Session name</label><input class="input" name="session_name" maxlength="120" required placeholder="Example: Physics — Light & Reflection"></div><div class="dashboard-grid"><div class="span-6"><div class="form-group"><label>Duration</label><select name="duration"><option value="90">90 minutes</option><option value="120">120 minutes</option><option value="180">180 minutes</option></select></div></div><div class="span-6"><div class="form-group"><label>Questions per student</label><input class="input" type="number" name="question_limit" min="1" max="10000000" value="100" required><div class="muted" style="font-size:.82rem;margin-top:7px">Allowed range: 1 to 1 crore.</div></div></div></div><button class="btn">Create Session & Generate QR</button></form></section>{% endblock %}
