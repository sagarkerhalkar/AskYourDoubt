services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sagarkerhalkar/askyourdoubt:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "9000"
    volumes:
      - ayd_database:/app/data
      - ayd_uploads:/app/static/uploads
      - ayd_qr:/app/static/qr
      - ayd_exports:/app/exports
      - ayd_brand:/app/static/brand
    networks: [ayd]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ayd]

networks:
  ayd:

volumes:
  ayd_database:
  ayd_uploads:
  ayd_qr:
  ayd_exports:
  ayd_brand:
  caddy_data:
  caddy_config:
