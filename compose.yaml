services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: askyourdoubt:1.5.2
    container_name: askyourdoubt
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AYD_PORT:-9000}:${AYD_PORT:-9000}"
    volumes:
      - ayd_database:/app/data
      - ayd_uploads:/app/static/uploads
      - ayd_qr:/app/static/qr
      - ayd_exports:/app/exports
      - ayd_brand:/app/static/brand
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('AYD_PORT','9000')+'/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ayd_database:
  ayd_uploads:
  ayd_qr:
  ayd_exports:
  ayd_brand:
